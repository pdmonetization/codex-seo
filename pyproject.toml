[project]
name = "codex-seo"
version = "2.2.4+codex.1"
description = "Comprehensive SEO analysis skill suite for Codex"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
keywords = [
  "codex",
  "codex-skills",
  "seo",
  "ai-seo",
  "technical-seo",
  "core-web-vitals",
  "schema-markup",
  "dataforseo",
  "mcp",
  "e-e-a-t",
  "geo",
]
authors = [
  { name = "Daniel Agrici" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.urls]
Homepage = "https://github.com/pdmonetization/codex-seo"
Repository = "https://github.com/pdmonetization/codex-seo"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
